name: Game Simulator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      games:
        description: 'Number of games to simulate'
        required: false
        default: '20'
      max_turns:
        description: 'Maximum turns per game'
        required: false
        default: '100'

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run simulator
        run: |
          GAMES="${{ github.event.inputs.games || '20' }}"
          MAX_TURNS="${{ github.event.inputs.max_turns || '100' }}"
          cargo run --release --bin simulate -- --games "$GAMES" --max-turns "$MAX_TURNS"
