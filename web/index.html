<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bevy Civ</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161a; color: #e8e6df; font: 16px system-ui, sans-serif; overflow: hidden; }
    #game { position: fixed; inset: 0; }
    #bevy-canvas { display: block; width: 100%; height: 100%; outline: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; pointer-events: none; }
    #status.hidden { display: none; }
  </style>
</head>
<body>
  <div id="game"><canvas id="bevy-canvas" tabindex="0"></canvas></div>
  <div id="status">Loading Bevy Civ…</div>
  <script>
    // Browsers start Web Audio suspended until the player interacts with the page, and the game
    // creates its audio context at launch. Keep track of every context and resume it on the first
    // click, tap or key press, so sound effects work without a reload.
    (() => {
      const Base = window.AudioContext || window.webkitAudioContext;
      if (!Base) return;
      const contexts = [];
      window.AudioContext = class extends Base {
        constructor(...args) {
          super(...args);
          contexts.push(this);
        }
      };
      const resume = () => contexts.forEach((context) => context.state === "suspended" && context.resume());
      for (const event of ["pointerdown", "touchend", "keydown"]) {
        document.addEventListener(event, resume, { capture: true });
      }
    })();
  </script>
  <script>
    // Saved games: the game hands its save to bevyCivDownload, and asks for a file with
    // bevyCivPickFile; the text of the chosen file waits for it in bevyCivTakeImport.
    window.bevyCivDownload = (name, text) => {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      link.download = name;
      document.body.appendChild(link);
      link.click();
      setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 1000);
    };
    let imported = null;
    window.bevyCivPickFile = () => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".json,application/json";
      input.onchange = async () => {
        const file = input.files && input.files[0];
        if (file) imported = await file.text();
      };
      input.click();
    };
    window.bevyCivTakeImport = () => {
      const text = imported;
      imported = null;
      return text;
    };
  </script>
  <script type="module">
    import init from "./bevy-civ.js";

    const status = document.getElementById("status");
    const canvas = document.getElementById("bevy-canvas");
    // Hide the loading text once the game starts drawing into the canvas.
    new MutationObserver((_, observer) => {
      status.classList.add("hidden");
      canvas.focus();
      observer.disconnect();
    }).observe(canvas, { attributes: true, attributeFilter: ["width", "height", "style"] });

    init().catch((error) => {
      // winit unwinds out of `main` with this exception by design; it is not a failure.
      if (String(error?.message ?? error).includes("Using exceptions for control flow")) return;
      console.error(error);
      status.classList.remove("hidden");
      status.textContent = "Bevy Civ failed to start. It needs a browser with WebGL2 enabled.";
    });
  </script>
</body>
</html>
