[package]
name = "bevy-civ"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["full", "audio"]
full = ["bevy", "hexx"]
# Sound effects. Build with `--no-default-features --features full` for a silent game without audio deps.
audio = ["full", "bevy/bevy_audio", "bevy/wav"]

[dependencies]
# Only the pieces a 2D game needs: keeps the web build small. Audio comes from the `audio` feature.
bevy = { version = "0.15", optional = true, default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "webgl2",
    "x11",
] }
hexx = { version = "0.21", features = ["algorithms", "serde"], optional = true }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "bevy_civ"
path = "src/lib.rs"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"
required-features = []

[[bin]]
name = "bevy-civ"
path = "src/main.rs"
required-features = ["full"]

# Web build: the `rand`/`ahash` dependency chain needs a JS-backed entropy source.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
web-sys = { version = "0.3", features = ["Storage", "Window"] }
wasm-bindgen = "0.2"

# Size-optimised profile for the browser build (Cloudflare caps static assets at 25 MiB per file).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true # keeps the .wasm under the 25 MiB limit; wasm-bindgen warns about it, harmlessly
panic = "abort"
