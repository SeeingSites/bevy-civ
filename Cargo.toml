[package]
name = "bevy-civ"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
  "bevy_ecs", "bevy_app", "bevy_core", "bevy_time", "bevy_log", "bevy_hierarchy"
] }
hexx = { version = "0.21", features = ["bevy", "algorithms"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "bevy_civ"
path = "src/lib.rs"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"
